[[plugins]]
  package = "@netlify/plugin-lighthouse"

  # optional, deploy the lighthouse report to a path under your site
  [plugins.inputs.audits]
    output_path = "reports/lighthouse.html"

# /shop-parts duplicates /parts
[[redirects]]
  from = "/shop-parts"
  to = "/parts"
  status = 301
  force = true

# Blog cleanup (Oct 2026): drive-wheel post removed, checklist moved to a matching URL
[[redirects]]
  from = "/blog/drive-wheel"
  to = "/blog/common-issues"
  status = 301
  force = true

[[redirects]]
  from = "/blog/trouble-shooting-guide"
  to = "/blog/maintenance-checklist"
  status = 301
  force = true

# IndexNow: notify Bing & co. of changed pages after each production deploy
[[plugins]]
  package = "/netlify/plugins/indexnow"
